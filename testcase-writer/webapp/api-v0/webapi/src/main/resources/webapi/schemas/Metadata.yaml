'_IdObject':
  type: object
  discriminator:
    propertyName: tcDataType
  required: [ id ]
  properties:
    id:
      type: string
      x-constraints: "Id" 
'_NamedObject':
  type: object
  allOf:
    - $ref: '#/_IdObject'
  discriminator:
    propertyName: tcDataType
  required: [ name ]
  properties:
    name:
      type: string
Metadata:
  type: object
  required: [transientId, description]
  properties:
    transientId:
      type: string
    description:
      type: string
    creationDate:
      type: string
      format: date-time
    tags:
      type: array
      items:
        type: string
